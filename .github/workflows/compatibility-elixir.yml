name: Elixir Compatibility

on:
  pull_request:
  push:
    branches:
      - main

env:
  MIX_ENV: test
  WASMEX_BUILD: true
  CARGO_COMPONENT_VERSION: 0.21.1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    strategy:
      fail-fast: false
      matrix:
        otp: [27.3.4.19, 28.5.0.8, 29.1.2]
        elixir: [1.18.6, 1.19.7, 1.20.5]
        exclude:
          - otp: 28.5.0.8
            elixir: 1.18.6
          - otp: 29.1.2
            elixir: 1.18.6
          - otp: 29.1.2
            elixir: 1.19.7
          - otp: 29.1.2
            elixir: 1.20.5
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Install cargo-component
        uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-component@${{ env.CARGO_COMPONENT_VERSION }}

      - name: Add targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32-wasip1
          rustup target add wasm32-wasip2

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: elixir-tests
          add-job-id-key: false
          cache-bin: false
          save-if: ${{ matrix.otp == '28.5.0.8' && matrix.elixir == '1.20.5' }}
          workspaces: |
            native/wasmex
            test/fixture_projects/component_exported_interface
            test/fixture_projects/component_type_conversions
            test/fixture_projects/guest_resource_component
            test/fixture_projects/wasi_test
            test/fixture_projects/wasm_import_test
            test/fixture_projects/wasm_link_dep_test
            test/fixture_projects/wasm_link_import_test
            test/fixture_projects/wasm_link_test
            test/fixture_projects/wasm_test

      - name: Install Mix dependencies
        run: mix do deps.get + deps.compile

      - name: Run tests
        run: mix test
